name: CI & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*' # Triggers the workflow when you push tags like 'v0.1.0'
  pull_request:
    branches: [main]

# Grant permission to create a release and upload assets
permissions:
  contents: write

# Auto-cancel superseded runs on the same branch/PR so CI never queues stale
# work behind newer commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze, Dart tests, Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: this version is the single source of truth — the F-Droid
          # metadata reads it from this file via tool/ci/fdroid_flutter_setup.sh.
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust

      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml)
          if [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG does not match pubspec version $VER." \
              "Bump app/pubspec.yaml or retag." >&2
            exit 1
          fi
          echo "Releasing $VER (tag $GITHUB_REF_NAME)"

      - name: Verify F-Droid metadata version
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml)
          BASE=$(sed -n 's/^version: *[0-9][0-9.]*+\([0-9][0-9]*\).*/\1/p' app/pubspec.yaml)
          META=docs/fdroid-metadata.yml
          META_VER=$(sed -n 's/^CurrentVersion: *//p' "$META")
          META_CODE=$(sed -n 's/^CurrentVersionCode: *//p' "$META")
          EXPECTED_CODE=$((BASE * 10 + 3))
          test "$META_VER" = "$VER" \
            || { echo "$META: CurrentVersion '$META_VER' != pubspec '$VER'"; exit 1; }
          test "$META_CODE" = "$EXPECTED_CODE" \
            || { echo "$META: CurrentVersionCode '$META_CODE' != '$EXPECTED_CODE'"; exit 1; }
          echo "F-Droid metadata version: $META_VER ($META_CODE)"

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Validate installer script (dry-run)
        working-directory: app
        run: dart run tool/build_installer.dart --dry-run

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Dart tests
        working-directory: app
        run: flutter test

      - name: Rust format check
        working-directory: app/rust
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: app/rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: app/rust
        run: cargo test

      - name: Rust AI feature lint and tests
        working-directory: app/rust
        run: |
          cargo clippy --features ai --all-targets -- -D warnings
          cargo test --features ai

      - name: Build-tooling tests
        run: python3 -m unittest discover -s tool/ci -p 'test_*.py' -v

  build-android:
    name: Release APKs (F-Droid buildserver container)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    # Signing secrets live on the 'ci' environment (see tool/ci/make_release_keystore.sh).
    # Builds still succeed unsigned when the secrets are absent (PRs, forks).
    environment: ci
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
      options: --user root
    timeout-minutes: 75
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      FLUTTER_HOME: /opt/flutter
      ANDROID_HOME: /opt/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl unzip xz-utils zip sudo \
            binutils clang cmake make ninja-build pkg-config
          # Pinned Android toolchain (ADR 0004). The NDK matches the Flutter
          # 3.44.x default so `ndkVersion = flutter.ndkVersion` resolves offline.
          # `yes` dies of SIGPIPE (141) once sdkmanager closes stdin — expected
          # under pipefail; tolerate exactly that, keep real failures fatal.
          yes | sdkmanager "ndk;28.2.13676358" "build-tools;36.0.0" \
            || [ "$?" -eq 141 ]
          # Pinned Flutter — same version as analyze-and-test.
          git clone --depth 1 --branch 3.44.8 \
            https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          "$FLUTTER_HOME/bin/flutter" config --no-analytics
          "$FLUTTER_HOME/bin/flutter" precache --android

      # Pinned Rust via the same action as analyze-and-test. A manual
      # `curl | sh` rustup in this container job installed into
      # $HOME/.cargo (/github/home) while the script invoked
      # /root/.cargo/bin/rustup — exit 127. The action owns
      # CARGO_HOME/PATH end-to-end, and `targets:` preinstalls the
      # Android triples so cargokit's rustup checks stay offline.
      - name: Set up Rust (Android targets preinstalled)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Prebuild (pinned pub get)
        run: tool/ci/android_prebuild.sh

      - name: Build release APKs (per-ABI + universal, reproducible)
        env:
          APERTUREX_KEYSTORE_BASE64: ${{ secrets.APERTUREX_KEYSTORE_BASE64 }}
          APERTUREX_KEYSTORE_PASSWORD: ${{ secrets.APERTUREX_KEYSTORE_PASSWORD }}
          APERTUREX_KEY_PASSWORD: ${{ secrets.APERTUREX_KEY_PASSWORD }}
          APERTUREX_KEY_ALIAS: ${{ secrets.APERTUREX_KEY_ALIAS }}
        run: tool/ci/android_build.sh

      - name: Verify native libraries in every APK
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          # Every per-ABI APK must ship a non-empty libapp.so (Dart AOT),
          # librust_lib_aperturex.so (Rust engine), and libonnxruntime.so (AI
          # release runtime), and each .so must match its ABI's machine type —
          # the "wrong .so got packaged" failure mode.
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="app/build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -f "$apk" || { echo "Missing $apk"; exit 1; }
            unzip -o -q "$apk" \
              "lib/$abi/libapp.so" "lib/$abi/librust_lib_aperturex.so" \
              "lib/$abi/libonnxruntime.so" -d "$TMP"
            for so in "$TMP/lib/$abi/libapp.so" \
              "$TMP/lib/$abi/librust_lib_aperturex.so" \
              "$TMP/lib/$abi/libonnxruntime.so"; do
              test -s "$so" || { echo "Empty or missing $so"; exit 1; }
              # Full machine string after "Machine:" — `awk '{print $2,$3}'`
              # emitted a trailing space ("ARM ") and truncated x86-64 to
              # "Advanced Micro", so every correct binary was rejected.
              machine=$(readelf -h "$so" | sed -n 's/^ *Machine:[[:space:]]*//p')
              case "$abi:$machine" in
                armeabi-v7a:ARM) ;;
                arm64-v8a:AArch64) ;;
                x86_64:"Advanced Micro Devices X86-64") ;;
                *) echo "$so: machine '$machine' does not match ABI $abi"; exit 1 ;;
              esac
              echo "$abi: $(basename "$so") OK ($machine)"
            done
          done
          test -s app/build/app/outputs/flutter-apk/app-release.apk \
            || { echo "Missing universal app-release.apk"; exit 1; }
          echo "Universal APK OK"

      - name: Upload Dart symbol files
        uses: actions/upload-artifact@v4
        with:
          name: aperturex-symbols
          path: app/build/symbols
          if-no-files-found: warn

      - name: Upload APK artifacts (workflow summary)
        uses: actions/upload-artifact@v4
        with:
          name: aperturex-apks
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS (unsigned, best-effort)
    needs: analyze-and-test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build unsigned iOS app
        working-directory: app
        # On failure, retry with -v: without it flutter hides the raw
        # xcodebuild output behind a canned "Development Team" diagnosis
        # (mac.dart diagnoseXcodeBuildFailure), which is misleading under
        # --no-codesign where DEVELOPMENT_TEAM is legitimately empty.
        run: |
          flutter build ios --release --no-codesign || \
            flutter build ios --release --no-codesign -v

      - name: Package Runner.app as zip
        working-directory: app/build/ios/iphoneos
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' ../../../pubspec.yaml)
          zip -r -y "aperturex-ios-v${VERSION}.zip" Runner.app
          mkdir -p ../../../build/ios-release
          mv "aperturex-ios-v${VERSION}.zip" ../../../build/ios-release/

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: aperturex-ios
          path: app/build/ios-release/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows (release + Inno Setup installer)
    needs: analyze-and-test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Extract version
        id: extract-version
        working-directory: app
        shell: pwsh
        run: |
          $ver = (Select-String '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' pubspec.yaml).Matches[0].Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT
          echo "APP_VERSION=$ver"

      - name: Build release Windows app
        working-directory: app
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (ISCC)
        working-directory: app
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          dart run tool/build_installer.dart --iscc "$iscc"

      - name: Verify engine dll + installer
        working-directory: app
        shell: pwsh
        run: |
          $dll = "build/windows/x64/runner/Release/rust_lib_aperturex.dll"
          Test-Path $dll -PathType Leaf -ErrorAction Stop
          $size = (Get-Item $dll).Length
          if ($size -eq 0) { Write-Error "rust_lib_aperturex.dll is empty"; exit 1 }
          Write-Host "Engine DLL OK ($size bytes)"
          $exe = Get-ChildItem "build/installers/aperturex_setup_*.exe" -ErrorAction Stop
          Write-Host "Installer OK: $($exe.Name) ($($exe.Length) bytes)"

      - name: Zip Release dir
        working-directory: app
        shell: pwsh
        run: |
          $ver = "${{ steps.extract-version.outputs.version }}"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/aperturex-windows-v$ver.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: aperturex-windows
          path: |
            app/build/aperturex-windows-v*.zip
            app/build/installers/aperturex_setup_*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (release tarball)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust

      - name: Install GTK dependencies
        run: sudo apt-get install -y --no-install-recommends ninja-build libgtk-3-dev

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Extract version
        id: extract-version
        run: |
          VER=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Build release Linux app
        working-directory: app
        run: flutter build linux --release

      - name: Verify engine .so
        working-directory: app
        run: |
          set -euo pipefail
          SO=$(ls build/linux/x64/release/bundle/lib/librust_lib_aperturex*.so 2>/dev/null | head -1)
          if [ -z "$SO" ]; then echo "Missing librust_lib_aperturex*.so in bundle"; exit 1; fi
          if [ ! -s "$SO" ]; then echo "Empty $SO"; exit 1; fi
          echo "Engine .so OK: $SO"

      - name: Create tarball
        working-directory: app
        run: |
          VER="${{ steps.extract-version.outputs.version }}"
          tar -czf build/aperturex-linux-v$VER.tar.gz -C build/linux/x64/release bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: aperturex-linux
          path: app/build/aperturex-linux-v*.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS (release .app)
    needs: analyze-and-test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Extract version
        id: extract-version
        run: |
          VER=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Build release macOS app
        working-directory: app
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: flutter build macos --release

      - name: Verify engine dylib
        working-directory: app
        run: |
          set -euo pipefail
          DYLIB=$(find build/macos/Build/Products/Release -name "librust_lib_aperturex.dylib" 2>/dev/null | head -1)
          if [ -z "$DYLIB" ]; then echo "Missing librust_lib_aperturex.dylib in .app Frameworks"; exit 1; fi
          if [ ! -s "$DYLIB" ]; then echo "Empty $DYLIB"; exit 1; fi
          echo "Engine dylib OK: $DYLIB"

      - name: Zip .app
        working-directory: app
        run: |
          VER="${{ steps.extract-version.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/ApertureX.app build/aperturex-macos-v$VER.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: aperturex-macos
          path: app/build/aperturex-macos-v*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [analyze-and-test, build-android, build-ios, build-windows, build-linux, build-macos]
    # Android is required for a release; desktop + iOS are best-effort. Only runs on tags.
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      !cancelled() &&
      needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: aperturex-apks
          path: release/apks

      - name: Download iOS artifact (if build succeeded)
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: aperturex-ios
          path: release/ios

      - name: Download Windows artifact (if build succeeded)
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: aperturex-windows
          path: release/windows

      - name: Download Linux artifact (if build succeeded)
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: aperturex-linux
          path: release/linux

      - name: Download macOS artifact (if build succeeded)
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: aperturex-macos
          path: release/macos

      - name: Prepare release body from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="[$VERSION]" '
            /^## \[/ {
              if (index($0, "## " ver) == 1) { on = 1; print; next }
              if (on) exit
            }
            on
          ' app/CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No '## [$VERSION]' section found in app/CHANGELOG.md" >&2
            exit 1
          fi

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/assets
          # upload-artifact strips parent dirs to the least common ancestor,
          # so APKs arrive flat in release/apks/. Plain '**' only globs
          # recursively when `globstar` is on (bash defaults it off, which
          # made cp stat the literal pattern and fail with "cannot stat").
          # `nullglob` keeps an empty match from reaching cp at all.
          shopt -s nullglob globstar
          apks=(release/apks/**/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APKs found under release/apks/:" >&2
            find release -type f >&2 || true
            exit 1
          fi
          cp "${apks[@]}" release/assets/
          if [ -d release/ios ]; then
            zips=(release/ios/*.zip)
            if [ "${#zips[@]}" -gt 0 ]; then
              cp "${zips[@]}" release/assets/
            fi
          fi
          if [ -d release/windows ]; then
            cp release/windows/*.zip release/assets/ 2>/dev/null || true
            cp release/windows/*.exe release/assets/ 2>/dev/null || true
          fi
          if [ -d release/linux ]; then
            cp release/linux/*.tar.gz release/assets/ 2>/dev/null || true
          fi
          if [ -d release/macos ]; then
            cp release/macos/*.zip release/assets/ 2>/dev/null || true
          fi
          echo "Staged assets:"
          ls -la release/assets/

      - name: Verify F-Droid release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE=$(sed -n 's/^version: *[0-9][0-9.]*+\([0-9][0-9]*\).*/\1/p' app/pubspec.yaml)
          test -n "$BASE" || { echo "Cannot read build number from app/pubspec.yaml"; exit 1; }

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT=$(find "$SDK/build-tools" -type f -name aapt2 | sort -V | tail -1)
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$AAPT" || { echo "aapt2 not found under $SDK/build-tools"; exit 1; }
          test -x "$APKSIGNER" || { echo "apksigner not found under $SDK/build-tools"; exit 1; }

          # F-Droid's check apk job rejects reference APKs containing AGP's
          # 0x504B4453 "Dependency metadata" signing block.
          python3 tool/ci/strip_dependency_metadata.py --check release/assets/*.apk

          # Must match AllowedAPKSigningKeys in docs/fdroid-metadata.yml.
          EXPECTED_CERT=745e013035b596f1190c54ee1cf798b2d59a70100d284bb8fa0ff7c5af3dcdac
          test -s release/assets/app-release.apk \
            || { echo "Missing universal app-release.apk"; exit 1; }

          for spec in armeabi-v7a:1 arm64-v8a:2 x86_64:3; do
            abi="${spec%:*}"
            offset="${spec#*:}"
            apk="release/assets/app-${abi}-release.apk"
            test -s "$apk" || { echo "Missing $apk (F-Droid binary URL)"; exit 1; }

            badging=$("$AAPT" dump badging "$apk")
            pkg=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging")
            name=$(sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" <<<"$badging")
            code=$(sed -n "s/^package: .* versionCode='\([0-9]*\)'.*/\1/p" <<<"$badging")
            expected=$((BASE * 10 + offset))

            test "$pkg" = "com.devparadise.aperturex" \
              || { echo "$apk: package '$pkg' is wrong"; exit 1; }
            test "$name" = "$VERSION" \
              || { echo "$apk: versionName '$name' != '$VERSION'"; exit 1; }
            test "$code" = "$expected" \
              || { echo "$apk: versionCode '$code' != '$expected'"; exit 1; }

          # Only verify signing cert if signing keys are configured.
          # PR builds without signing keys produce unsigned APKs, which is fine
          # for PR verification. Release builds on tags require signed APKs.
          if [ -n "${APERTUREX_KEYSTORE_BASE64:-}" ]; then
            cert=$("$APKSIGNER" verify --print-certs "$apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "$cert" = "$EXPECTED_CERT" \
              || { echo "$apk: signing cert '$cert' != '$EXPECTED_CERT'"; exit 1; }
            echo "$abi: package=$pkg versionName=$name versionCode=$code cert=$cert"
          else
            echo "$abi: package=$pkg versionName=$name versionCode=$code cert=UNSET (PR build)"
          fi
          done

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          allowUpdates: true
          update_release_body: true
          files: |
            release/assets/*
          name: Release ${{ github.ref_name }}
