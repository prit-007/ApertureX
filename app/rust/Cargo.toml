[package]
name = "rust_lib_tessera"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
zune-jpeg = "0.5.15"
jpeg-encoder = "0.7.1"

# The Flutter debug build maps to Cargo's `dev` profile. Without optimization
# the colour/spatial math runs 10-50x slower — the cause of multi-second slider
# lag when running `flutter run`. Optimize the dev profile so debug builds are
# usable; `release`/`profile` modes stay fully optimized.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
