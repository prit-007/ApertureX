[package]
name = "rust_lib_aperturex"
version = "0.3.5"
edition = "2021"

[lib]
# rlib lets `cargo test`/examples link the crate (e.g. examples/gen_corpus);
# Flutter ships the cdylib through cargokit.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
zune-jpeg = "0.5.15"
jpeg-encoder = "0.7.1"
miniz_oxide = "0.8.9"
rawler = "0.8.0"
libraw = { version = "0.1.1", optional = true }
num-bigint = "0.4.8"
num-traits = "0.2.19"
rayon = "1.10"

# Optional ONNX Runtime Mobile backend (ADR 0010, #87).
#
# Mobile release builds load the runtime dynamically so Cargokit never needs
# network access and the APK ships a single vendored `libonnxruntime.so` per
# ABI (see tool/ci/vendor_ort_android.sh). Host-side tests keep using the
# `download-binaries` convenience because there is no Android/iOS lib to load.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "load-dynamic", "api-24"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-24"] }

[features]
# Optional LibRaw fallback for camera coverage. Off by default: the default
# build is pure-Rust (ADR 0005, see docs/spikes/raw-engine-spike.md).
raw-libraw = ["dep:libraw"]
# Optional AI inference runtime feature (ADR 0010, #87).
ai = ["dep:ort"]
# Android NNAPI / iOS CoreML execution providers, enabled per platform build.
ai-nnapi = ["ai", "ort/nnapi"]
ai-coreml = ["ai", "ort/coreml"]

# The Flutter debug build maps to Cargo's `dev` profile. Without optimization
# the colour/spatial math runs 10-50x slower — the cause of multi-second slider
# lag when running `flutter run`. Optimize the dev profile so debug builds are
# usable; `release`/`profile` modes stay fully optimized.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
