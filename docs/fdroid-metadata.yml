# ApertureX — F-Droid metadata for com.devparadise.aperturex.
#
# The fdroiddata branch is the source of truth:
#   metadata/com.devparadise.aperturex.yml
# Keep this copy in sync with it. The recipe targets one build per ABI because
# the release APKs are split per ABI; version codes follow base * 10 + 1..3.
#
# Upstream store metadata lives in fastlane/metadata/android/en-US/ so F-Droid
# can read the listing, icon, feature graphic, and versionCode-keyed changelogs.
#
# Reproducibility notes:
#   * `scanignore` is used instead of `scandelete` for `.pub-cache`,
#     `app/rust/vendor`, and `app/android/app/src/main/jniLibs`: Flutter plugins
#     ship required prebuilt native libraries and assets in the pub cache, the
#     vendored crates are required for the offline Rust build, and the jniLibs
#     hold the prebuilt ONNX Runtime release library. Deleting them makes the
#     F-Droid APK differ from the release APK or breaks the build.
#   * The repo is moved to /__w/ApertureX/ApertureX during prebuild/build so
#     paths match the GitHub Actions release builds (same as the published APKs).
#   * `SOURCE_DATE_EPOCH=0` and the per-ABI Flutter commands live in
#     tool/ci/android_build.sh, shared by GitHub CI and F-Droid. The Rust build
#     also remaps the Cargo home to /github/home/.cargo so panic-location paths
#     match the GitHub release APKs byte-for-byte.
#   * tool/ci/android_build.sh removes AGP's 0x504B4453 "Dependency metadata"
#     APK signing block after every build. F-Droid's `check apk` rejects it in
#     reference binaries; the block is outside the v2-signed data, so stripping
#     it preserves the release signature.
#   * Binaries/binary URLs must match the GitHub release asset names exactly.
#   * The project GitLab buildserver has network access. An official F-Droid
#     buildserver is offline, so vendored crates (`tool/ci/rust_vendor.sh`) are
#     still required before submitting to the official fdroiddata repository.

