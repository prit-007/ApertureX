IssueTracker: https://github.com/prit-007/ApertureX/issues
Changelog: https://github.com/prit-007/ApertureX/blob/HEAD/app/CHANGELOG.md

Name: ApertureX
AutoName: ApertureX

RepoType: git
Repo: https://github.com/prit-007/ApertureX.git
Binaries: 
  https://github.com/prit-007/ApertureX/releases/download/v%v/app-armeabi-v7a-release.apk

Builds:
  - versionName: 0.2.4
    versionCode: 41
    commit: d086a3260808e16402564dcae4a4eb0f51cea757
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends cmake libglu1-mesa libsecret-1-dev
        ninja-build tcl clang make git rustup
      - mkdir -p /__w/ApertureX /opt
      - chown -R vagrant /__w /opt
    output: app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/prit-007/ApertureX/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.44.8
    rm:
      - app/ios
    prebuild:
      - tool/ci/fdroid_flutter_setup.sh $$flutter$$
      - export orig=$(pwd) repo=/__w/ApertureX/ApertureX; cd ..; mv com.devparadise.aperturex
        $repo; cd $repo; export PUB_CACHE=$(pwd)/.pub-cache; export PATH=/opt/flutter/bin:$PATH;
        tool/ci/android_prebuild.sh
      - mv $repo "$orig"
    scanignore:
      - .pub-cache
      - app/rust/vendor
      - app/android/app/src/main/jniLibs
    build:
      - export orig=$(pwd) repo=/__w/ApertureX/ApertureX; cd ..; mv com.devparadise.aperturex
        $repo; cd $repo; export PUB_CACHE=$(pwd)/.pub-cache; export PATH=/opt/flutter/bin:$PATH;
        export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=/github/home/.cargo"
      - tool/ci/android_build.sh android-arm
      - mv $repo "$orig"
    ndk: 28.2.13676358

